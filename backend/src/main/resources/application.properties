# Application
spring.application.name=clinica-beleza-total

# Server
server.port=8080

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/clinica_beleza_total
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# JWT
jwt.secret=Q2xpZmljYUJlbGV6YVRvdGFsU2VjcmV0S2V5MjAyNkNsaWZpY0FCZWxlemFRdWVUb3RhbFNlY3JldA==
jwt.expiration=86400000

# WhatsApp API (Evolution API ou similar)
whatsapp.api.url=http://localhost:8081
whatsapp.api.key=sua-api-key

# LGPD - Configurações de privacidade
lgpd.dias-retensao-dados=365
lgpd.email-contato=privacidade@belezatotal.com.br

# Logger
logging.level.com.clinicabelezatotal=DEBUG
