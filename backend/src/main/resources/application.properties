# Application
spring.application.name=clinica-beleza-total

# Server
server.port=8080

# PostgreSQL
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/clinica_beleza_total}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Flyway
spring.flyway.enabled=false
spring.flyway.locations=classpath:db/migration

# JWT
jwt.secret=${JWT_SECRET:Y2xpZmljYUJlbGV6YVRvdGFsU2VjcmV0S2V5MjAyNkNsaWZpY0FCZWxlemFRdWVUb3RhbFNlY3JldA==}
jwt.expiration=86400000

# WhatsApp API (Evolution API ou similar)
# habilitado=true => envio real (exige Evolution API em pé, docker compose up -d postgres redis evolution-api)
# habilitado=false => modo MOCK (apenas loga a mensagem no console)
whatsapp.api.url=${WHATSAPP_API_URL:http://localhost:8081}
whatsapp.api.key=${WHATSAPP_API_KEY:B22D5427010E-4E41-875E-B841A9497218}
whatsapp.phone-number-id=${WHATSAPP_PHONE_NUMBER_ID:clinica}
whatsapp.habilitado=${WHATSAPP_HABILITADO:true}

# Lembretes (intervalo em ms - padrão 15 min)
lembrete.intervalo=900000

# LGPD - Configurações de privacidade
lgpd.dias-retensao-dados=365
lgpd.email-contato=privacidade@belezatotal.com.br

# Logger
logging.level.com.clinicabelezatotal=INFO

# SpringDoc/Swagger
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
